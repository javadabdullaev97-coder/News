name: Source health check

# Раз в сутки проверяем, что ленты из config/news-sources.json живы.
#
# Повод: 1 августа 2026 обнаружилось, что 13 источников из 36 мертвы, причём
# давно. Фетчер молча пропускает упавшую ленту, и вместе с ней тихо исчез весь
# международный слой — Reuters, Eurasianet, Fergana, CABAR, Kazinform. Планёрки
# работали на одних узбекских сигналах, считая, что видят мировой контекст.
#
# Workflow не чинит конфиг, он поднимает шум: падает, если сломанных лент
# больше порога, и печатает список.
#
# ПОРОГ ПОДНЯТ С 2 ДО 6 — 17.08.2026, вместе с технологическим направлением.
# Двойка ставилась на 36 лентах, сейчас их 199 (177 активных), и на этом
# объёме она срабатывает не на поломке, а на фоновом шуме: часть лент
# «ломается» по своей природе. `usgs-quakes` отдаёт ноль записей всегда,
# когда за последний час не было землетрясений магнитудой 4,5+, то есть
# большую часть суток; `geofon-quakes` и `us-embassy-tashkent` регулярно
# отваливаются по таймауту и оживают сами. Сторож, который кричит каждый
# день, — это сторож, на которого перестают смотреть.
#
# Шесть из 177 — это 3,4%. Реальная поломка слоя (уход целого блока лент,
# как 1 августа) даёт больше и всё равно поднимет шум.

on:
  repository_dispatch:
    types: [source-health]
  # Расписание переехало во внешние часы — воркер leap.uz дёргает этот запуск
  # через repository_dispatch (см. src/worker.ts). Родной schedule убран
  # намеренно: он пропускал больше половины тиков и опаздывал на десятки минут,
  # а держать его вторым входом бессмысленно — сломанный будильник не страховка.
  workflow_dispatch:
    inputs:
      max_dead:
        description: "Порог: сколько сломанных лент терпим"
        required: false
        default: "6"

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check every feed in config/news-sources.json
        run: |
          MAX_DEAD="${{ github.event.inputs.max_dead || '6' }}"
          node scripts/check-sources.mjs --max-dead="$MAX_DEAD"
