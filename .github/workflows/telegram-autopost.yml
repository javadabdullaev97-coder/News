name: Telegram autopost

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**/*.mdx"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = только показать что запостил бы, ничего не отправлять"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: tg-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Полная глубина — git-push-with-rebase.sh делает rebase на свежий
          # origin/main, shallow-клон при rebase может отвалиться.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Post new articles to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          SITE_URL: "https://leap.uz"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/post-to-telegram.mjs

      - name: Commit state changes
        if: github.event.inputs.dry_run != '1'
        run: |
          if [[ -z $(git status --porcelain content/state/telegram-posted.json) ]]; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/state/telegram-posted.json
          git commit -m "state: telegram-posted updated"
          bash .github/scripts/git-push-with-rebase.sh
