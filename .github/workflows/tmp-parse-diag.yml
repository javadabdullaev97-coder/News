name: TMP parse diag

# ВРЕМЕННЫЙ воркфлоу, удаляется сразу после прогона.
#
# Повод: прогон news-inbox 04:20 UTC 17.08.2026 уронил шесть лент, заведённых
# накануне: fia-official отдал 403, все пять лент transfermarkt — «Unable to
# parse XML». Из песочницы агента те же адреса возвращают 200 и валидный XML,
# то есть воспроизвести отказ там нельзя.
#
# Диагностика идёт тем же rss-parser, которым ходит фетчер: check-sources.mjs
# считает вхождения <item регуляркой и на этих лентах молчит, а парсер строже.
# Печатаем статус, content-type и первые байты тела — по ним видно, отдали нам
# XML или страницу-заглушку.

on:
  push:
    branches: [claude/sports-news-optimization-aer7t9]
    paths: [".github/workflows/tmp-parse-diag.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund --no-save --ignore-scripts

      - name: Diagnose failing feeds
        run: |
          cat > /tmp/diag.mjs <<'EOF'
          import Parser from "rss-parser";
          const UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";
          const ACCEPT="application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.5";
          const parser=new Parser({timeout:25000,headers:{"User-Agent":UA,Accept:ACCEPT}});
          const URLS=[
            ["fia-official","https://www.fia.com/rss/news/all"],
            ["transfermarkt-uk","https://www.transfermarkt.co.uk/rss/news"],
            ["transfermarkt-de","https://www.transfermarkt.de/rss/news"],
            ["transfermarkt-es","https://www.transfermarkt.es/rss/news"],
            ["transfermarkt-it","https://www.transfermarkt.it/rss/news"],
            ["transfermarkt-tr","https://www.transfermarkt.com.tr/rss/news"],
            ["skysports-f1","https://www.skysports.com/rss/12433"],
            ["motorsport-f1","https://www.motorsport.com/rss/f1/news/"]
          ];
          for (const [id,url] of URLS) {
            let line=`${id.padEnd(18)} `;
            try {
              const r=await fetch(url,{headers:{"User-Agent":UA,Accept:ACCEPT},redirect:"follow"});
              const body=await r.text();
              line+=`http=${r.status} ct=${(r.headers.get("content-type")||"—").split(";")[0].padEnd(24)} bytes=${String(body.length).padStart(7)} `;
              line+=`head=${JSON.stringify(body.slice(0,60))} `;
            } catch(e){ line+=`fetch-FAIL=${e.message} `; }
            try {
              const f=await parser.parseURL(url);
              line+=`| rss-parser: OK ${f.items.length} items`;
            } catch(e){ line+=`| rss-parser: FAIL ${String(e.message).slice(0,60)}`; }
            console.log(line);
          }
          EOF
          node /tmp/diag.mjs
