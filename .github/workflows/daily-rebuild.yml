name: Daily CBU rebuild

# Каждый день в 14:00 UTC = 19:00 Ташкента
# (после стандартной публикации курсов ЦБ в 17–18:00)
on:
  repository_dispatch:
    types: [daily-rebuild]
  # Расписание переехало во внешние часы — воркер leap.uz дёргает этот запуск
  # через repository_dispatch (см. src/worker.ts). Родной schedule убран
  # намеренно: он пропускал больше половины тиков и опаздывал на десятки минут,
  # а держать его вторым входом бессмысленно — сломанный будильник не страховка.
  # Позволяет запустить вручную через UI GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

env:
  # GitHub меняет ноду на воркер-машинах с 16 июня 2026 — опираемся
  # на новую заранее, чтобы избежать варнинга в логах.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create empty commit to trigger Cloudflare rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE_TASHKENT=$(TZ='Asia/Tashkent' date '+%d.%m.%Y %H:%M')
          git commit --allow-empty -m "chore: daily CBU rate refresh (${DATE_TASHKENT} Ташкента)"
          bash .github/scripts/git-push-with-rebase.sh
