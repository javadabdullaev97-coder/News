name: Pull news inbox

on:
  # Внешние часы: воркер leap.uz дёргает этот запуск по своему расписанию,
  # потому что планировщик GitHub пропускает больше половины тиков
  # (замеры в src/worker.ts). Cron ниже остаётся страховкой.
  repository_dispatch:
    types: [fetch-news]
  # Расписание переехало во внешние часы — воркер leap.uz дёргает этот запуск
  # через repository_dispatch (см. src/worker.ts). Родной schedule убран
  # намеренно: он пропускал больше половины тиков и опаздывал на десятки минут,
  # а держать его вторым входом бессмысленно — сломанный будильник не страховка.
  workflow_dispatch:
    inputs:
      priority:
        description: "Только приоритет (P0,P1,P2,P3) — пусто = все"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-inbox
  cancel-in-progress: false

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-save

      - name: Pull RSS inbox
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.priority }}" ]; then
            ARGS="--priority=${{ github.event.inputs.priority }}"
          fi
          node scripts/pull-news-inbox.mjs $ARGS
        continue-on-error: true

      - name: Pull Telegram inbox
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.priority }}" ]; then
            ARGS="--priority=${{ github.event.inputs.priority }}"
          fi
          node scripts/pull-telegram-inbox.mjs $ARGS
        continue-on-error: true

      # Сайты без работающего RSS: daryo, repost, turkmenportal, eurasianet.
      # Разбираются по форме адреса из HTML — подробности в скрипте.
      - name: Scrape sites without RSS
        run: node scripts/pull-scrape-inbox.mjs
        # Не роняем сбор новостей из-за одного переехавшего сайта: скрипт
        # возвращает ненулевой код, когда шаблон перестал находить ссылки,
        # и это надо видеть в логе, но не ценой всего инбокса.
        continue-on-error: true

      # Сторож ЧП. Смотрит на то, что фетчер только что принёс, и при
      # совпадении «тревожное слово + узбекский топоним» шлёт владельцу
      # сигнал в Telegram.
      #
      # Здесь, а не отдельным воркфлоу по расписанию: данные уже на диске,
      # свежее момента сразу после фетча не будет, и лишний запуск не нужен.
      # Планёрка придёт максимум через 20 минут и возьмёт тему в работу —
      # сторож только сокращает время до того, как о событии станет известно.
      #
      # Индекс источников нужен, чтобы отличить официальное подтверждение
      # от перепечатки; он производный и собирается тут же.
      - name: Build source index
        run: node scripts/build-source-index.mjs
        continue-on-error: true

      - name: Watch for emergencies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CHAT_ID: ${{ secrets.TELEGRAM_EDITOR_CHAT_ID }}
        run: node scripts/breaking-watch.mjs
        # Сторож не должен ронять фетч: инбокс важнее сигнала. Но и молча
        # умирать ему нельзя — падение будет видно в логе шага.
        continue-on-error: true

      # Ротация инбокса. Читаются только сегодняшний и вчерашний файлы
      # (readInbox в lib/inbox-core.mjs), окно свежести — сутки; всё, что
      # старше, не открывает никто. Замер 09.08.2026: 26 МБ в двадцати
      # файлах, рост около 3 МБ в сутки без границы. Планёрка работает
      # в свежем клоне и тянет этот вес трижды в час.
      #
      # Здесь, а не отдельным расписанием: каталог только что изменён этим
      # же прогоном, и удаление уедет тем же коммитом. История остаётся
      # в git — старый файл достаётся `git show <коммит>:<путь>`.
      - name: Rotate stale inbox files
        run: node scripts/rotate-inbox.mjs --apply
        continue-on-error: true

      # Уплотнение журнала тем. Каждый прогон планёрки пишет свой файл
      # content/state/seen/<день>-<runId>.jsonl — так сделано намеренно,
      # чтобы соседние прогоны не конфликтовали при rebase. Уплотнение
      # сворачивает старые файлы в общий seen-topics.json.
      #
      # Оно существовало, но не было заведено никуда: замер 09.08.2026 —
      # 516 файлов на 2,5 МБ, накопленных с 03.08, и loadJournal читает
      # их ВСЕ на каждом вызове (планёрка, preflight, inbox-select).
      # Шапка самого topic-journal.mjs предупреждает, что несвязанные
      # вызовы «плодят мелкие файлы», — так и вышло.
      #
      # Окно 3 суток: свежие файлы трогать нельзя, по ним живут брони.
      - name: Compact topic journal
        run: node scripts/topic-journal.mjs compact --older-than-days=3
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          if [[ -z $(git status --porcelain content/inbox content/state/breaking-alerts.json content/state/channel-candidates.jsonl content/state/seen content/state/seen-topics.json) ]]; then
            echo "Ничего нового — не коммитим."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAMP=$(TZ='Asia/Tashkent' date '+%H:%M %d.%m')
          git add content/inbox
          # Состояние сторожа: по нему он не шлёт семь сообщений об одном
          # землетрясении. Без коммита каждый следующий запуск считал бы,
          # что ещё не сигналил.
          git add content/state/breaking-alerts.json 2>/dev/null || true
          # Кандидаты в источники: ТГ-каналы из статей конкурентов с контекстом
          # упоминания. Копятся фетчерами, разбирает планёрка.
          git add content/state/channel-candidates.jsonl 2>/dev/null || true
          # Результат уплотнения журнала: свёрнутые файлы удалены,
          # seen-topics.json пополнен. Без этих двух путей уплотнение
          # отработало бы вхолостую — файлы бы удалялись в рабочем дереве
          # раннера и воскресали на следующем запуске.
          git add content/state/seen 2>/dev/null || true
          git add content/state/seen-topics.json 2>/dev/null || true
          git commit -m "inbox: $STAMP Ташкента"
          bash .github/scripts/git-push-with-rebase.sh
