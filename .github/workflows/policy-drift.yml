name: Policy drift check

# Раз в сутки сверяет опубликованные статьи с актуальным
# config/newsroom-policy.json и §2/§5 SKILL. Ловит дрейф:
# policy декларирует одно, статьи идут другим путём.
#
# Что проверяем:
#   - категория валидна
#   - urgency проставлен и из списка breaking|standard|deferred
#   - нет ссылок на источники из чёрного списка
#   - все frontmatter.sources цитируются в теле (балласт)
#   - дневной кап по категории не превышен

on:
  repository_dispatch:
    types: [policy-drift]
  # Расписание переехало во внешние часы — воркер leap.uz дёргает этот запуск
  # через repository_dispatch (см. src/worker.ts). Родной schedule убран
  # намеренно: он пропускал больше половины тиков и опаздывал на десятки минут,
  # а держать его вторым входом бессмысленно — сломанный будильник не страховка.
  workflow_dispatch:
    inputs:
      days:
        description: "За сколько дней проверять"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: policy-drift
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps (для lib/frontmatter.mjs)
        run: npm install --no-audit --no-fund --no-save

      # Выжимки инструкций не должны молча отставать от источников.
      # Планёрка при рассинхроне не ломается (читает полный документ и пишет
      # в отчёт), но каждый её прогон дорожает — красный прогон здесь заметнее.
      - name: Check doc digests freshness
        run: node scripts/check-doc-digest.mjs --strict

      - name: Check drift
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          node scripts/check-policy-drift.mjs --days="$DAYS" --verbose
        continue-on-error: true

      - name: Commit drift report
        run: |
          if [[ -z $(git status --porcelain content/state/policy-drift.md) ]]; then
            echo "Отчёт не менялся."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/state/policy-drift.md
          git commit -m "drift: daily policy check"
          bash .github/scripts/git-push-with-rebase.sh
