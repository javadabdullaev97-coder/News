name: Audit telegram duplicates

# Сверяет реестр отправленного с тем, что реально висит в каналах.
#
# ЗАЧЕМ ОТДЕЛЬНЫМ ПРОГОНОМ. Реестр лежит в git, канал живёт своей жизнью,
# и расхождение между ними не видит никто — пока не напишет подписчик.
# 18.08.2026 владелец нашёл статью в пяти экземплярах; когда механику
# починили, сплошная сверка подняла ещё двадцать четыре лишних сообщения
# в спортивных каналах, про которые не знал никто.
#
# Прогон краснеет, если в канале живут две копии одного материала. Это
# не поломка сборки, а сигнал: зайди и посмотри. Заявку на снятие
# собирает тот же скрипт с флагом --request.
#
# Секретов не требует: проверка идёт по публичной странице t.me.

on:
  schedule:
    # Раз в шесть часов. Точность здесь не нужна — расхождение живёт
    # часами, а не минутами, поэтому обычного расписания GitHub хватает
    # (внешние часы заведены для публикации, где минуты важны).
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "channel — ru | uz | sport-ru | sport-uz | tech-ru | tech-uz (пусто — все)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: audit-telegram
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Коды возврата разведены намеренно:
      #   0 — чисто;
      #   1 — найдены дубли, это провал и повод зайти;
      #   2 — часть каналов не проверена (у @leap_news закрыт предпросмотр).
      #
      # Второй случай красным делать НЕЛЬЗЯ: русский канал закрыт постоянно,
      # прогон краснел бы каждые шесть часов, и через неделю на красный
      # никто бы не смотрел. Поэтому предупреждение видное, а статус зелёный.
      - name: Сверить каналы
        run: |
          set +e
          if [[ -n "${{ github.event.inputs.channel }}" ]]; then
            node scripts/audit-telegram-duplicates.mjs --channel "${{ github.event.inputs.channel }}"
          else
            node scripts/audit-telegram-duplicates.mjs
          fi
          code=$?
          set -e
          case $code in
            0) echo "Дублей нет." ;;
            2) echo "::warning::Часть каналов не проверена — предпросмотр закрыт. Дубли там видны только глазами." ;;
            *) echo "::error::В каналах найдены дубли. Снять: node scripts/audit-telegram-duplicates.mjs --request, затем пуш заявки."
               exit 1 ;;
          esac
