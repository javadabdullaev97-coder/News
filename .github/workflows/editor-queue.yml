name: Collect editor replies

# Забирает ответы владельца из Telegram и применяет их к материалам,
# ожидающим подтверждения.
#
# Планёрка не может ждать человека: она отрабатывает и завершается. Поэтому
# петля разомкнута — планёрка кладёт материал в очередь и уходит, а этот
# workflow периодически проверяет, не ответил ли владелец, и подтягивает
# присланное фото или комментарий в репозиторий.

on:
  # Планёрка положила вопрос в репозиторий — вопрос уходит владельцу СРАЗУ,
  # а не на ближайшем тике будильника.
  #
  # Раньше единственным входом был cron каждые 10 минут, и к нему добавлялось
  # обычное опоздание планировщика GitHub — на практике 10–25 минут между
  # «планёрка засомневалась» и «владелец увидел вопрос». Для материала, чей
  # смысл в дедлайне (отключение воды с утра, приём заявлений до даты), эта
  # задержка съедает половину ценности.
  #
  # Пуш-триггер закрывает первую половину петли — вопрос К владельцу.
  # Вторая половина — ответ ОТ владельца — по-прежнему ждёт cron: чтобы
  # забрать реплай из Telegram, нужен либо опрос по расписанию, либо webhook.
  #
  # Cron ниже НЕ УБРАН и убирать его нельзя: он остаётся страховкой на случай
  # пропущенного события и единственным входом для remind (напоминания о
  # зависших материалах приходят по времени, а не по пушу).
  push:
    branches: [main]
    paths:
      - "content/needs-verification/**"
      - "content/rework/**"
      - "content/posts/**"
  schedule:
    # Круглосуточно, без окон. Тихих часов в системе нет нигде:
    # publishing.incremental.quietHours = null, все воркфлоу идут 24/7.
    # Разбор того, как окно 07:00–23:00 однажды задержало материал
    # с дедлайном, — в docs/routine-prompts/planyorka-rationale.md.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-queue
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # rebase на свежий origin/main требует полной истории.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # editor-queue.mjs с mode=scan-pending импортирует lib/frontmatter.mjs,
      # которому нужен npm-пакет `yaml`. Без install падает на ERR_MODULE_NOT_FOUND.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-save

      # Ответ владельца фотографией обрабатывает scripts/prepare-image.py, а ему
      # нужен Pillow. Его тут не было НИКОГДА, поэтому любое присланное фото
      # падало: скрипт отдавал {"error": "Pillow не установлен"} и выходил с 1.
      # Виден баг не был, потому что editor-queue.mjs на такой отказ не бросал
      # исключение — материал уходил в resolved, оставаясь заблокированным.
      # Так 3 августа встали два материала, включая отключение воды с дедлайном.
      - name: Install Pillow for image processing
        run: python3 -m pip install --quiet Pillow

      # Планёрка в песочнице Claude Code не имеет доступа к секретам TG и не
      # может сама вызвать push. Вместо этого она пишет pendingEditorQuestion
      # во frontmatter материала в content/needs-verification/ или
      # content/rework/. scan-pending находит их и пушит в TG на этом runner-е,
      # где секреты есть.
      - name: Push pending questions to owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CHAT_ID: ${{ secrets.TELEGRAM_EDITOR_CHAT_ID }}
        run: node scripts/editor-queue.mjs scan-pending

      - name: Collect replies from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CHAT_ID: ${{ secrets.TELEGRAM_EDITOR_CHAT_ID }}
          # Comma-separated список Telegram user ID, кому разрешено отвечать
          # в очередь. Пусто = принимаем всех (WARN в логе). Настоятельно
          # рекомендуется задать: без whitelist кто угодно, у кого есть
          # доступ к чату-очереди, может прислать фото → оно уходит в прод.
          TELEGRAM_EDITOR_USER_IDS: ${{ secrets.TELEGRAM_EDITOR_USER_IDS }}
        run: node scripts/editor-queue.mjs collect

      - name: Remind about unanswered items
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CHAT_ID: ${{ secrets.TELEGRAM_EDITOR_CHAT_ID }}
        run: node scripts/editor-queue.mjs remind

      - name: Commit collected input
        id: collected
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff --quiet не видит untracked-файлы. status --porcelain видит.
          # content/needs-verification/ и content/rework/ добавлены: scan-pending
          # чистит pendingEditorQuestion из frontmatter после успешного push —
          # это тоже надо коммитить, иначе следующий scan снова его увидит
          # (для рабоспособности хватит queue.json, но dual-defense).
          if [[ -z $(git status --porcelain -- content/state/editor-queue.json .review/ content/posts/ public/images/ content/rejected/ content/needs-verification/ content/rework/) ]]; then
            echo "Ответов нет — коммитить нечего."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"
          git add content/state/editor-queue.json .review/ content/posts/ public/images/ content/rejected/ content/needs-verification/ content/rework/
          git commit -m "newsroom: ответы редактора из Telegram"
          bash .github/scripts/git-push-with-rebase.sh

      # Разослать в канал то, что владелец только что одобрил.
      #
      # Почему прямо здесь, а не привычным путём через telegram-autopost.yml.
      # Тот воркфлоу срабатывает на push в content/posts/**. Но GitHub НЕ
      # запускает воркфлоу от пушей, сделанных с GITHUB_TOKEN, — это встроенная
      # защита от рекурсии, и обойти её можно только личным токеном.
      #
      # То есть материал, одобренный ответом «ок», уезжал в content/posts/
      # пушем этого джоба — и telegram-autopost на него не реагировал вовсе.
      # На сайт статья попадала (Cloudflare собирает из main напрямую), в канал
      # не попадала никогда. Сейчас застрявших нет только потому, что почти все
      # публикации шли из планёрки, у которой токен другой.
      #
      # Скрипт идемпотентен: дедуп по content/state/telegram-posted.json,
      # уже отправленное повторно не уйдёт. Материалы с awaitingEditor и без
      # broadcast:true он пропускает сам.
      #
      # Условие — только когда ответ владельца реально применён. Иначе шаг
      # выполнялся бы на каждом пуше в content/posts (а их теперь несколько
      # в час), и при двух и более неразосланных материалах post-to-telegram
      # усыплял бы джоб на 15 минут между постами, держа группу concurrency
      # и задерживая сбор следующего ответа ровно на то время, которое мы и
      # пытаемся убрать.
      #
      # success() указан явно: заданный if ОТМЕНЯЕТ неявную проверку успеха
      # предыдущих шагов. Без него провалившийся push всё равно пропустил бы
      # рассылку дальше — в канал ушло бы то, чего нет в main.
      - name: Post approved articles to Telegram
        if: success() && steps.collected.outputs.applied == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          SITE_URL: "https://leap.uz"
        run: node scripts/post-to-telegram.mjs

      - name: Commit telegram state
        if: success() && steps.collected.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z $(git status --porcelain -- content/state/telegram-posted.json) ]]; then
            echo "В канал ничего не уходило."
            exit 0
          fi
          git add content/state/telegram-posted.json
          git commit -m "state: telegram-posted обновлён после ответа редактора"
          bash .github/scripts/git-push-with-rebase.sh
