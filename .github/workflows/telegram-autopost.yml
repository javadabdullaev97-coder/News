name: Telegram autopost

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**/*.mdx"
      # Файл-заявка: сессия без прав на dispatch кладёт
      # content/state/autopost-request.json и пушит. Нужно, чтобы запустить
      # заливку канала руками — например при подключении нового языка,
      # когда пуша в content/posts не предвидится.
      - "content/state/autopost-request.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = только показать что запостил бы, ничего не отправлять"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  # ОДНА очередь на всё, что трогает Telegram-канал: автопост, перепубликация
  # и оба чистильщика. Раньше у каждого воркфлоу была своя группа, и они шли
  # параллельно. Реестр «что уже отправлено» лежит в git, поэтому прогон,
  # начавшийся до пуша соседа, читает устаревший файл и отправляет материал
  # повторно — так 05.08.2026 в канал дважды ушёл разбор закона об
  # антикоррупции (message 127 и 128 с разрывом девять секунд).
  #
  # Отмена ожидающего прогона при этом безопасна: post-to-telegram.mjs каждый
  # раз обходит весь content/posts, а не только изменённый файл, поэтому
  # пропущенное подхватит следующий запуск.
  group: telegram-channel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Полная глубина — git-push-with-rebase.sh делает rebase на свежий
          # origin/main, shallow-клон при rebase может отвалиться.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # post-to-telegram.mjs импортирует lib/frontmatter.mjs, а тот — пакет
      # `yaml`. Без установки зависимостей шаг падает на ERR_MODULE_NOT_FOUND
      # ещё до первого поста, то есть автопост не работает вообще ни для одной
      # статьи. Шаг скопирован с news-inbox.yml и policy-drift.yml, где он есть.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-save

      - name: Post new articles to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_CHANNEL_UZ: ${{ secrets.TELEGRAM_CHANNEL_UZ }}
          SITE_URL: "https://leap.uz"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/post-to-telegram.mjs

      - name: Commit state changes
        if: github.event.inputs.dry_run != '1'
        run: |
          # Журналы состояния создаются только при первой записи, а `git add`
          # на несуществующий путь падает с кодом 128 и роняет весь шаг —
          # так 03.08.2026 четыре прогона подряд не смогли применить ответы
          # владельца. touch делает путь существующим всегда.
          touch content/state/telegram-posted.jsonl
          if [[ -z $(git status --porcelain content/state/telegram-posted.jsonl) ]]; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/state/telegram-posted.jsonl
          git commit -m "state: telegram-posted updated"
          bash .github/scripts/git-push-with-rebase.sh
