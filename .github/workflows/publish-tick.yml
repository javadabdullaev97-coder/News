name: Publish from queue

# Выпускает из content/queue/ то, чему пришёл срок.
#
# Планёрка отрабатывает пачкой и уходит. Без этого шага её материалы падали
# на сайт залпом, а следующие полчаса не выходило ничего. Публикатор
# разносит пачку по времени и продолжает капать, даже если очередная
# планёрка вернулась ни с чем.
#
# Дальше всё уже висит на факте появления файла в content/posts:
# Cloudflare пересобирает сайт на пуш, telegram-autopost срабатывает
# на путь content/posts/**/*.mdx. Отдельной системы публикации нет —
# есть управление моментом переноса.

on:
  # Планёрка положила материал в очередь — первый выпуск уходит сразу,
  # не дожидаясь тика, и заодно записывается подсказка о следующем сроке.
  push:
    branches: [main]
    paths:
      - "content/queue/**"
  # Внешние часы. Воркер leap.uz сам смотрит, есть ли что выпускать, и
  # дёргает этот запуск только когда есть. Расписание GitHub здесь не
  # используется принципиально: оно пропускает больше половины тиков,
  # а публикация — единственное, что читатель видит напрямую.
  repository_dispatch:
    types: [publish-tick]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = только показать план, ничего не переносить"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  # Один выпускающий за раз. Два параллельных перенесли бы один и тот же
  # файл дважды: второй упал бы на renameSync, а до этого успел бы
  # закоммитить половину.
  group: publish-tick
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Полная глубина: git-push-with-rebase.sh делает rebase на свежий
          # origin/main, а publish-tick.mjs достаёт время постановки в очередь
          # из первого коммита файла, если в frontmatter его нет.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # npm install ОБЯЗАТЕЛЕН: lib/frontmatter.mjs тянет npm-пакет yaml.
      # Первая версия воркфлоу его пропускала «для экономии восьми секунд» —
      # и publish-tick падал на первом импорте в каждом прогоне, а пайплайн
      # с | tee маскировал код падения, так что прогоны зеленели. 04.08.2026
      # четыре материала пролежали в очереди при двух «успешных» запусках.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-save

      - name: Release what is due
        id: release
        run: |
          # pipefail обязателен: без него код выхода пайплайна — это код tee,
          # и упавший publish-tick выглядел бы успехом.
          set -o pipefail
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            ARGS="--dry-run"
          fi
          node scripts/publish-tick.mjs $ARGS | tee "$RUNNER_TEMP/result.json"

      - name: Commit released articles
        if: github.event.inputs.dry_run != '1'
        run: |
          # Каталог очереди может исчезнуть целиком, когда выпущен последний
          # материал, поэтому git add идёт по обоим путям сразу.
          if [[ -z $(git status --porcelain -- content/queue content/posts content/state/publish-plan.json) ]]; then
            echo "Выпускать нечего."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SLUGS=$(node -e "
            const r = require('$RUNNER_TEMP/result.json');
            process.stdout.write(r.released.map(x => x.slug).join(', ') || 'ничего');
          ")
          git add content/queue content/posts content/state/publish-plan.json
          git commit -m "publish: $SLUGS"
          bash .github/scripts/git-push-with-rebase.sh

      # Отправка в канал — ЗДЕСЬ ЖЕ, а не по push-триггеру автопоста.
      #
      # Коммит выше сделан служебным GITHUB_TOKEN, а GitHub не даёт таким
      # пушам запускать другие воркфлоу — push-триггер telegram-autopost
      # на выпуски публикатора не срабатывает и не сработает никогда.
      # Третья инкарнация одной и той же ловушки за 04.08.2026.
      #
      # Скрипт идемпотентен (дедуп по слагу), тихие часы и broadcast:false
      # он учитывает сам.
      - name: Post released articles to Telegram
        if: github.event.inputs.dry_run != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_CHANNEL_UZ: ${{ secrets.TELEGRAM_CHANNEL_UZ }}
          SITE_URL: "https://leap.uz"
        run: node scripts/post-to-telegram.mjs

      - name: Commit telegram state
        if: github.event.inputs.dry_run != '1'
        run: |
          touch content/state/telegram-posted.jsonl
          if [[ -z $(git status --porcelain -- content/state/telegram-posted.jsonl) ]]; then
            echo "В канал ничего не уходило."
            exit 0
          fi
          git add content/state/telegram-posted.jsonl
          git commit -m "state: telegram-posted обновлён публикатором"
          bash .github/scripts/git-push-with-rebase.sh
