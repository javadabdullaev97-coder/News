name: Pull news inbox

on:
  schedule:
    # Каждые ~15 минут двумя crontab-ами на off-hour минутах.
    # GitHub скипает часть запусков в :00 из-за нагрузки — дублируем,
    # чтобы гарантированно отрабатывало 3-4 раза в час.
    - cron: "5,35 * * * *"
    - cron: "20,50 * * * *"
  workflow_dispatch:
    inputs:
      priority:
        description: "Только приоритет (P0,P1,P2,P3) — пусто = все"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-inbox
  cancel-in-progress: false

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pull RSS inbox
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.priority }}" ]; then
            ARGS="--priority=${{ github.event.inputs.priority }}"
          fi
          node scripts/pull-news-inbox.mjs $ARGS
        continue-on-error: true

      - name: Pull Telegram inbox
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.priority }}" ]; then
            ARGS="--priority=${{ github.event.inputs.priority }}"
          fi
          node scripts/pull-telegram-inbox.mjs $ARGS
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          if [[ -z $(git status --porcelain content/inbox) ]]; then
            echo "Ничего нового — не коммитим."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAMP=$(TZ='Asia/Tashkent' date '+%H:%M %d.%m')
          git add content/inbox
          git commit -m "inbox: $STAMP Ташкента"
          # Retry with exponential backoff on network errors
          for i in 1 2 3 4; do
            if git push origin main; then
              exit 0
            fi
            sleep $((2 ** i))
          done
          exit 1
