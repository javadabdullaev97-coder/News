name: Collect TG post metrics

# Раз в час собирает счётчик просмотров каждого TG-поста в
# content/state/metrics-daily.json. База для калибровки policy:
# видно, какие категории/темы реально читают, а какие проваливаются.

on:
  # Внешние часы: воркер leap.uz дёргает этот запуск по своему расписанию,
  # потому что планировщик GitHub пропускает больше половины тиков
  # (замеры в src/worker.ts). Cron ниже остаётся страховкой.
  repository_dispatch:
    types: [metrics]
  # Расписание переехало во внешние часы — воркер leap.uz дёргает этот запуск
  # через repository_dispatch (см. src/worker.ts). Родной schedule убран
  # намеренно: он пропускал больше половины тиков и опаздывал на десятки минут,
  # а держать его вторым входом бессмысленно — сломанный будильник не страховка.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = только показать топ, ничего не писать"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Collect views from t.me public embed
        env:
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/collect-metrics.mjs

      - name: Commit metrics
        if: github.event.inputs.dry_run != '1'
        run: |
          if [[ -z $(git status --porcelain content/state/metrics-daily.json) ]]; then
            echo "Метрики не менялись."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/state/metrics-daily.json
          git commit -m "metrics: TG views snapshot"
          bash .github/scripts/git-push-with-rebase.sh
