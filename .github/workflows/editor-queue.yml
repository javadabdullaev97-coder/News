name: Collect editor replies

# Забирает ответы владельца из Telegram и применяет их к материалам,
# ожидающим подтверждения.
#
# Планёрка не может ждать человека: она отрабатывает и завершается. Поэтому
# петля разомкнута — планёрка кладёт материал в очередь и уходит, а этот
# workflow периодически проверяет, не ответил ли владелец, и подтягивает
# присланное фото или комментарий в репозиторий.

on:
  schedule:
    # Каждые 10 минут круглосуточно. Раньше стояло "*/10 2-18 * * *" —
    # 07:00–23:00 Ташкента. Окно противоречило решению владельца работать
    # 24/7 и публиковать по мере готовности: тихие часы отключены
    # в config/newsroom-policy.json (publishing.incremental.quietHours: null),
    # а этот cron остался прежним, и расхождение никто не заметил.
    #
    # Цена расхождения видна на прогоне 3 августа 05:25 Ташкента: пять
    # готовых материалов ждали владельца, вопрос о них не был отправлен
    # ни разу, и ближайший тик приходился на 07:00. Среди них — отключение
    # воды в 22 махаллях с дедлайном в 10:00: вопрос ушёл бы за три часа
    # до события, а материал готов со 2 августа.
    #
    # Ночью очередь обычно пуста, так что лишних запусков почти нет.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-queue
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # rebase на свежий origin/main требует полной истории.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # editor-queue.mjs с mode=scan-pending импортирует lib/frontmatter.mjs,
      # которому нужен npm-пакет `yaml`. Без install падает на ERR_MODULE_NOT_FOUND.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-save

      # Ответ владельца фотографией обрабатывает scripts/prepare-image.py, а ему
      # нужен Pillow. Его тут не было НИКОГДА, поэтому любое присланное фото
      # падало: скрипт отдавал {"error": "Pillow не установлен"} и выходил с 1.
      # Виден баг не был, потому что editor-queue.mjs на такой отказ не бросал
      # исключение — материал уходил в resolved, оставаясь заблокированным.
      # Так 3 августа встали два материала, включая отключение воды с дедлайном.
      - name: Install Pillow for image processing
        run: python3 -m pip install --quiet Pillow

      # Планёрка в песочнице Claude Code не имеет доступа к секретам TG и не
      # может сама вызвать push. Вместо этого она пишет pendingEditorQuestion
      # во frontmatter материала в content/needs-verification/ или
      # content/rework/. scan-pending находит их и пушит в TG на этом runner-е,
      # где секреты есть.
      - name: Push pending questions to owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CHAT_ID: ${{ secrets.TELEGRAM_EDITOR_CHAT_ID }}
        run: node scripts/editor-queue.mjs scan-pending

      - name: Collect replies from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CHAT_ID: ${{ secrets.TELEGRAM_EDITOR_CHAT_ID }}
          # Comma-separated список Telegram user ID, кому разрешено отвечать
          # в очередь. Пусто = принимаем всех (WARN в логе). Настоятельно
          # рекомендуется задать: без whitelist кто угодно, у кого есть
          # доступ к чату-очереди, может прислать фото → оно уходит в прод.
          TELEGRAM_EDITOR_USER_IDS: ${{ secrets.TELEGRAM_EDITOR_USER_IDS }}
        run: node scripts/editor-queue.mjs collect

      - name: Remind about unanswered items
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CHAT_ID: ${{ secrets.TELEGRAM_EDITOR_CHAT_ID }}
        run: node scripts/editor-queue.mjs remind

      - name: Commit collected input
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff --quiet не видит untracked-файлы. status --porcelain видит.
          # content/needs-verification/ и content/rework/ добавлены: scan-pending
          # чистит pendingEditorQuestion из frontmatter после успешного push —
          # это тоже надо коммитить, иначе следующий scan снова его увидит
          # (для рабоспособности хватит queue.json, но dual-defense).
          if [[ -z $(git status --porcelain -- content/state/editor-queue.json .review/ content/posts/ public/images/ content/rejected/ content/needs-verification/ content/rework/) ]]; then
            echo "Ответов нет — коммитить нечего."
            exit 0
          fi
          git add content/state/editor-queue.json .review/ content/posts/ public/images/ content/rejected/ content/needs-verification/ content/rework/
          git commit -m "newsroom: ответы редактора из Telegram"
          bash .github/scripts/git-push-with-rebase.sh
